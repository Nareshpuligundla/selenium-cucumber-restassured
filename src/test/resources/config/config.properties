# ─── WM Automation Framework – Base Configuration ─────────────────────────────
# All values can be overridden via Maven command-line: -D<key>=<value>

# Browser: chrome | firefox | edge
browser=chrome

# Headless mode: true | false
headless=false

# Active environment: qa | prod
environment=qa

# WM.com base URL
baseUrl=https://www.wm.com

# API base URL (JSONPlaceholder used as public stand-in for WM APIs)
apiBaseUrl=https://jsonplaceholder.typicode.com

# Wait timeouts (seconds)
explicitWait=20
pageLoadTimeout=30

# Screenshot on failure
screenshotOnFailure=true

# Retry failed tests
retryFailedTests=false
